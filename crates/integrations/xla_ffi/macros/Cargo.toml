[package]
name = "xla_ffi_macros"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Procedural macros for `xla_ffi` — `#[xla_ffi::handler]` lowers a Rust fn signature into an XLA FFI custom-call handler."

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true
