[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
markers = ["extensive: full-coverage tests", "capped_autotune: cap compiler search"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF002", "RUF003"]  # scientific docstrings use x / ~ / Angstrom deliberately

[tool.ruff.format]
quote-style = "double"
