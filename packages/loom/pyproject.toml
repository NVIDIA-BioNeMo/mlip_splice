[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2.0"]

[project]
name = "loom"
version = "0.1.0"
description = "Compile JAX lane programs into fused GPU kernels"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ['algebraic-real[jax]==0.1.0', 'jax>=0.8.0', 'numpy']

[project.optional-dependencies]
cuda13 = ["jax[cuda13]", "nvidia-cuda-nvrtc>=13,<14", "nvidia-nvjitlink>=13,<14", "nvidia-cuda-runtime>=13,<14", "nvidia-cuda-cccl>=13,<14"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "loom._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv.sources]
algebraic-real = { workspace = true }
